<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/English-Grammar-Cross-Web-Edition/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="English Grammar Learning App - Comprehensive grammar topics from A1 to C2 levels">
  <meta name="keywords" content="english grammar, learning, A1, A2, B1, B2, C1, C2, language learning">
  <meta name="author" content="Grammar Learning App">

  <!-- Performance optimizations -->
  <meta http-equiv="Cache-Control" content="public, max-age=31536000">
  <meta name="theme-color" content="#2196F3">

  <!-- Preconnect to external domains for faster loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Grammar Learning">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>English Grammar Learning App</title>
  <link rel="manifest" href="manifest.json">

  <!-- Loading screen styles -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .loading-text {
      font-size: 18px;
      font-weight: 500;
      text-align: center;
    }
    
    .loading-subtitle {
      font-size: 14px;
      opacity: 0.8;
      margin-top: 10px;
    }
    
    /* Hide loading screen when Flutter loads */
    .flutter-loaded .loading-container {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div class="loading-container">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading Grammar App</div>
    <div class="loading-subtitle">Preparing your learning experience...</div>
  </div>

  <!-- Flutter bootstrap script with optimizations -->
  <script>
    // Performance monitoring
    window.addEventListener('load', function() {
      console.log('Page loaded in:', performance.now(), 'ms');
    });

    // Hide loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      document.body.classList.add('flutter-loaded');
    });

    // Preload critical resources
    const preloadLink = document.createElement('link');
    preloadLink.rel = 'preload';
    preloadLink.href = 'flutter_bootstrap.js';
    preloadLink.as = 'script';
    document.head.appendChild(preloadLink);
  </script>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
